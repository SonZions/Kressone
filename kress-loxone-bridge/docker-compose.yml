version: '3.8'

services:

  kress-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kress-bridge
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Falls dein lokaler Mosquitto nicht als localhost erreichbar ist
    # (z.B. bei "network_mode: host" kannst du das auskommentieren):
    network_mode: host
