version: '3.8'

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"       # MQTT – Loxone verbindet sich hier
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  kress-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: kress-bridge
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./config/config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
